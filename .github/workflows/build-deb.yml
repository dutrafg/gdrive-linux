name: Build Debian package
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: gdrive-linux-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate Python syntax
        run: |
          python3 -m py_compile gdrive-linux rclone_backend.py settings.py progress.py google_oauth.py sync_plan.py safe_sync.py background_sync.py sync_display.py mount_drive.py mount_health.py mount_checks.py photos_export.py desktop_files.py deletion_review.py diagnostics.py rclone_errors.py mount_autostart.py sync_filters.py sync_profiles.py filemanager_bookmarks.py google_docs_export.py tray_indicator.py tray_autostart.py ui_kit.py
          python3 -m unittest -v test_backend test_settings test_progress test_google_oauth test_sync_plan test_safe_sync test_background_sync test_mount_drive test_mount_health test_mount_checks test_photos_export test_desktop_files test_deletion_review test_diagnostics test_rclone_errors test_sync_profiles test_desktop_integrations test_sync_service_exit test_sync_display
      - name: Install GTK4 Wayland test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 weston dbus-x11 rclone fuse3 xvfb
      - name: Offline rclone transfer integration tests
        run: |
          /usr/bin/python3 -m unittest -v test_integration test_background_sync test_sync_profiles
          /usr/bin/python3 -m unittest -v test_fuse_integration
      - name: GTK4 native Wayland startup smoke test
        run: |
          set -eu
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=wayland-gdrive-ci
          export GDK_BACKEND=wayland
          export GTK_A11Y=none
          export GSK_RENDERER=cairo
          export LIBGL_ALWAYS_SOFTWARE=1
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 --log=/tmp/weston-gdrive.log &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true; rm -rf "$XDG_RUNTIME_DIR"' EXIT
          for i in $(seq 1 40); do
            if [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then break; fi
            sleep 0.25
          done
          if [ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then
            cat /tmp/weston-gdrive.log
            exit 1
          fi
          set +e
          timeout 12s dbus-run-session -- /usr/bin/python3 gdrive-linux > /tmp/gdrive-smoke.log 2>&1
          result=$?
          set -e
          cat /tmp/gdrive-smoke.log
          if [ "$result" -ne 124 ]; then
            echo "GTK4 Wayland exited unexpectedly with code $result"
            cat /tmp/weston-gdrive.log
            exit 1
          fi
          dbus-run-session -- /usr/bin/python3 -m unittest -v test_ui_kit > /tmp/gdrive-ui-kit.log 2>&1 || {
            cat /tmp/gdrive-ui-kit.log
            exit 1
          }
          cat /tmp/gdrive-ui-kit.log
          dbus-run-session -- /usr/bin/python3 gdrive-linux --ui-smoke > /tmp/gdrive-ui-smoke.log 2>&1 || {
            cat /tmp/gdrive-ui-smoke.log
            exit 1
          }
          cat /tmp/gdrive-ui-smoke.log
          if grep -Eq "Traceback|NameError|TypeError|AttributeError|Gtk-ERROR|Gdk-ERROR" /tmp/gdrive-smoke.log; then
            echo "GTK4 Wayland smoke test detected an error"
            exit 1
          fi
      - name: Upload GTK4 diagnostic log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gtk4-smoke-diagnostics
          path: /tmp/gdrive-smoke.log
          if-no-files-found: ignore
      - name: Package with reproducible local script
        run: |
          bash -n build-deb.sh
          bash build-deb.sh
      - name: Validate Debian package metadata and contents
        run: |
          set -eu
          dpkg-deb --info gdrive-linux_0.14.3_all.deb
          dpkg-deb --contents gdrive-linux_0.14.3_all.deb
          test "$(dpkg-deb -f gdrive-linux_0.14.3_all.deb Package)" = "gdrive-linux"
          test "$(dpkg-deb -f gdrive-linux_0.14.3_all.deb Version)" = "0.14.3"
          mkdir -p /tmp/gdrive-deb-check
          dpkg-deb -x gdrive-linux_0.14.3_all.deb /tmp/gdrive-deb-check
          test -x /tmp/gdrive-deb-check/usr/bin/gdrive-linux
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/gdrive-linux
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/rclone_backend.py
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/settings.py
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/progress.py
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/google_oauth.py
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/sync_plan.py
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/background_sync.py
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/sync_display.py
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/mount_drive.py
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/mount_health.py
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/mount_checks.py
          grep -q 'Environment=PATH=' /tmp/gdrive-deb-check/usr/lib/systemd/user/gdrive-linux-mount.service
          grep -q 'TimeoutStartSec=180' /tmp/gdrive-deb-check/usr/lib/systemd/user/gdrive-linux-mount.service
          grep -q 'TimeoutStopSec=180' /tmp/gdrive-deb-check/usr/lib/systemd/user/gdrive-linux-mount.service
          grep -q 'RestartSec=900s' /tmp/gdrive-deb-check/usr/lib/systemd/user/gdrive-linux-mount.service
          grep -q "^Type=notify$" /tmp/gdrive-deb-check/usr/lib/systemd/user/gdrive-linux-mount.service
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/photos_export.py
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/desktop_files.py
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/deletion_review.py
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/diagnostics.py
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/rclone_errors.py
          for name in mount_autostart.py sync_filters.py sync_profiles.py filemanager_bookmarks.py google_docs_export.py tray_indicator.py tray_autostart.py; do
            test -f "/tmp/gdrive-deb-check/usr/share/gdrive-linux/$name"
          done
          test -f /tmp/gdrive-deb-check/usr/share/applications/gdrive-linux-indicator.desktop
          grep -q "^WantedBy=default.target$" /tmp/gdrive-deb-check/usr/lib/systemd/user/gdrive-linux-mount.service
          test -f /tmp/gdrive-deb-check/usr/lib/systemd/user/gdrive-linux-mount.service
          test -f /tmp/gdrive-deb-check/usr/lib/systemd/user/gdrive-linux-sync.timer
          test -f /tmp/gdrive-deb-check/usr/lib/systemd/user/gdrive-linux-sync.service
          systemd-analyze verify /tmp/gdrive-deb-check/usr/lib/systemd/user/gdrive-linux-sync.service /tmp/gdrive-deb-check/usr/lib/systemd/user/gdrive-linux-sync.timer /tmp/gdrive-deb-check/usr/lib/systemd/user/gdrive-linux-mount.service
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/safe_sync.py
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/style.css
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/ui_kit.py
          test -f /tmp/gdrive-deb-check/usr/share/applications/gdrive-linux.desktop
          python3 -m py_compile /tmp/gdrive-deb-check/usr/share/gdrive-linux/gdrive-linux
      - name: Install Debian package and verify launcher
        run: |
          set -eu
          sudo apt-get install -y ./gdrive-linux_0.14.3_all.deb
          test "$(dpkg-query -W -f='${Status}' gdrive-linux)" = "install ok installed"
          test "$(dpkg-query -W -f='${Version}' gdrive-linux)" = "0.14.3"
          test -x /usr/bin/gdrive-linux
          dpkg-deb -f gdrive-linux_0.14.3_all.deb Depends | grep -q 'gir1.2-gtk-4.0'
          dpkg-deb -f gdrive-linux_0.14.3_all.deb Depends | grep -q 'rclone'
          dpkg-deb -f gdrive-linux_0.14.3_all.deb Depends | grep -q 'fuse3'
          test -f /usr/share/gdrive-linux/gdrive-linux
          test -f /usr/share/gdrive-linux/style.css
          test -f /usr/share/gdrive-linux/ui_kit.py
          test -f /usr/lib/systemd/user/gdrive-linux-sync.timer
          test -f /usr/lib/systemd/user/gdrive-linux-mount.service
          test -f /usr/share/gdrive-linux/photos_export.py
          test -f /usr/share/gdrive-linux/sync_profiles.py
          test -f /usr/share/gdrive-linux/sync_display.py
          test -f /usr/share/gdrive-linux/mount_checks.py
          # Executed from the installed package, not the checked-out source tree.
          cd /tmp
          # Launch the installed GTK4 binary, not only the repository copy.
          xvfb-run -a -s "-screen 0 1366x768x24" \
            dbus-run-session -- /usr/bin/gdrive-linux --ui-smoke \
            > /tmp/gdrive-installed-ui.log 2>&1 || {
              cat /tmp/gdrive-installed-ui.log
              exit 1
            }
          cat /tmp/gdrive-installed-ui.log
          /usr/bin/python3 /usr/share/gdrive-linux/mount_checks.py > /tmp/gdrive-installed-preflight.txt
          grep -q 'rclone' /tmp/gdrive-installed-preflight.txt
          grep -q 'FUSE' /tmp/gdrive-installed-preflight.txt
          test -f /usr/share/gdrive-linux/google_docs_export.py
          test -f /usr/share/applications/gdrive-linux-indicator.desktop
          test -f /usr/share/applications/gdrive-linux.desktop
      - uses: actions/upload-artifact@v5
        with:
          name: gdrive-linux-deb
          path: gdrive-linux_0.14.3_all.deb
