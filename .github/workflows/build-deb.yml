name: Build Debian package
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: |
          python3 -m py_compile gdrive-linux rclone_backend.py settings.py progress.py
          python3 -m unittest -v test_backend test_settings test_progress
      - name: Install GTK4 smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 xvfb rclone
      - name: GTK4 startup smoke test
        run: |
          set +e
          timeout 12s xvfb-run -a /usr/bin/python3 gdrive-linux > /tmp/gdrive-smoke.log 2>&1
          result=$?
          cat /tmp/gdrive-smoke.log
          if [ "$result" -ne 124 ]; then
            echo "GTK4 exited unexpectedly with code $result"
            exit 1
          fi
          if grep -Eq "Traceback|NameError|TypeError|AttributeError|Gtk-WARNING|Gtk-ERROR" /tmp/gdrive-smoke.log; then
            echo "GTK4 smoke test detected an error"
            exit 1
          fi
      - name: Package
        run: |
          mkdir -p pkg/DEBIAN pkg/usr/bin pkg/usr/share/gdrive-linux pkg/usr/share/applications
          cp gdrive-linux pkg/usr/share/gdrive-linux/gdrive-linux
          cp rclone_backend.py pkg/usr/share/gdrive-linux/rclone_backend.py
          cp settings.py pkg/usr/share/gdrive-linux/settings.py
          cp progress.py pkg/usr/share/gdrive-linux/progress.py
          printf '#!/bin/sh\nexec /usr/bin/python3 /usr/share/gdrive-linux/gdrive-linux "$@"\n' > pkg/usr/bin/gdrive-linux
          chmod 755 pkg/usr/bin/gdrive-linux
          cat > pkg/DEBIAN/control <<'EOF'
          Package: gdrive-linux
          Version: 0.9.0
          Section: utils
          Priority: optional
          Architecture: all
          Depends: python3 (>= 3.9), python3-gi, gir1.2-gtk-4.0, rclone
          Maintainer: Drive para Linux <noreply@example.invalid>
          Description: Cliente grafico GTK4 para Google Drive usando rclone
          EOF
          cat > pkg/usr/share/applications/gdrive-linux.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Drive para Linux
          Exec=gdrive-linux
          Icon=folder-remote
          Categories=Network;FileTransfer;
          Terminal=false
          EOF
          dpkg-deb --build pkg gdrive-linux_0.9.0_all.deb
      - uses: actions/upload-artifact@v4
        with:
          name: gdrive-linux-deb
          path: gdrive-linux_0.9.0_all.deb
