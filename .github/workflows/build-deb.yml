name: Build Debian package
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: gdrive-linux-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: |
          python3 -m py_compile gdrive-linux rclone_backend.py settings.py progress.py google_oauth.py sync_plan.py safe_sync.py background_sync.py ui_kit.py
          python3 -m unittest -v test_backend test_settings test_progress test_google_oauth test_sync_plan test_safe_sync test_background_sync
      - name: Install GTK4 Wayland test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 weston dbus-x11 rclone
      - name: Offline rclone transfer integration tests
        run: /usr/bin/python3 -m unittest -v test_integration test_background_sync
      - name: GTK4 native Wayland startup smoke test
        run: |
          set -eu
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=wayland-gdrive-ci
          export GDK_BACKEND=wayland
          export GTK_A11Y=none
          export GSK_RENDERER=cairo
          export LIBGL_ALWAYS_SOFTWARE=1
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 --log=/tmp/weston-gdrive.log &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true; rm -rf "$XDG_RUNTIME_DIR"' EXIT
          for i in $(seq 1 40); do
            if [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then break; fi
            sleep 0.25
          done
          if [ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then
            cat /tmp/weston-gdrive.log
            exit 1
          fi
          set +e
          timeout 12s dbus-run-session -- /usr/bin/python3 gdrive-linux > /tmp/gdrive-smoke.log 2>&1
          result=$?
          set -e
          cat /tmp/gdrive-smoke.log
          if [ "$result" -ne 124 ]; then
            echo "GTK4 Wayland exited unexpectedly with code $result"
            cat /tmp/weston-gdrive.log
            exit 1
          fi
          dbus-run-session -- /usr/bin/python3 -m unittest -v test_ui_kit > /tmp/gdrive-ui-kit.log 2>&1 || {
            cat /tmp/gdrive-ui-kit.log
            exit 1
          }
          cat /tmp/gdrive-ui-kit.log
          dbus-run-session -- /usr/bin/python3 gdrive-linux --ui-smoke > /tmp/gdrive-ui-smoke.log 2>&1 || {
            cat /tmp/gdrive-ui-smoke.log
            exit 1
          }
          cat /tmp/gdrive-ui-smoke.log
          if grep -Eq "Traceback|NameError|TypeError|AttributeError|Gtk-ERROR|Gdk-ERROR" /tmp/gdrive-smoke.log; then
            echo "GTK4 Wayland smoke test detected an error"
            exit 1
          fi
      - name: Upload GTK4 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtk4-smoke-diagnostics
          path: /tmp/gdrive-smoke.log
          if-no-files-found: ignore
      - name: Package with reproducible local script
        run: |
          bash -n build-deb.sh
          bash build-deb.sh
      - name: Validate Debian package metadata and contents
        run: |
          set -eu
          dpkg-deb --info gdrive-linux_0.11.2_all.deb
          dpkg-deb --contents gdrive-linux_0.11.2_all.deb
          test "$(dpkg-deb -f gdrive-linux_0.11.2_all.deb Package)" = "gdrive-linux"
          test "$(dpkg-deb -f gdrive-linux_0.11.2_all.deb Version)" = "0.11.2"
          mkdir -p /tmp/gdrive-deb-check
          dpkg-deb -x gdrive-linux_0.11.2_all.deb /tmp/gdrive-deb-check
          test -x /tmp/gdrive-deb-check/usr/bin/gdrive-linux
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/gdrive-linux
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/rclone_backend.py
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/settings.py
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/progress.py
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/google_oauth.py
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/sync_plan.py
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/background_sync.py
          test -f /tmp/gdrive-deb-check/usr/lib/systemd/user/gdrive-linux-sync.timer
          test -f /tmp/gdrive-deb-check/usr/lib/systemd/user/gdrive-linux-sync.service
          systemd-analyze verify /tmp/gdrive-deb-check/usr/lib/systemd/user/gdrive-linux-sync.service /tmp/gdrive-deb-check/usr/lib/systemd/user/gdrive-linux-sync.timer
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/safe_sync.py
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/style.css
          test -f /tmp/gdrive-deb-check/usr/share/gdrive-linux/ui_kit.py
          test -f /tmp/gdrive-deb-check/usr/share/applications/gdrive-linux.desktop
          python3 -m py_compile /tmp/gdrive-deb-check/usr/share/gdrive-linux/gdrive-linux
      - name: Install Debian package and verify launcher
        run: |
          set -eu
          sudo apt-get install -y ./gdrive-linux_0.11.2_all.deb
          test "$(dpkg-query -W -f='${Status}' gdrive-linux)" = "install ok installed"
          test "$(dpkg-query -W -f='${Version}' gdrive-linux)" = "0.11.2"
          test -x /usr/bin/gdrive-linux
          dpkg-deb -f gdrive-linux_0.11.2_all.deb Depends | grep -q 'gir1.2-gtk-4.0'
          ! dpkg-deb -f gdrive-linux_0.11.2_all.deb Depends | grep -q 'rclone'
          dpkg-deb -f gdrive-linux_0.11.2_all.deb Recommends | grep -q 'rclone'
          test -f /usr/share/gdrive-linux/gdrive-linux
          test -f /usr/share/gdrive-linux/style.css
          test -f /usr/share/gdrive-linux/ui_kit.py
          test -f /usr/lib/systemd/user/gdrive-linux-sync.timer
          test -f /usr/share/applications/gdrive-linux.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: gdrive-linux-deb
          path: gdrive-linux_0.11.2_all.deb
